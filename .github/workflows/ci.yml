name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reservacore
          POSTGRES_PASSWORD: reservacore
          POSTGRES_DB: reservacore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reservacore -d reservacore_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://reservacore:reservacore@127.0.0.1:5432/reservacore_test?schema=public
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      JWT_SECRET: ci-only-jwt-secret-ci-only-jwt-secret
      CRON_SECRET: ci-only-cron-secret
      NEXT_PUBLIC_WHATSAPP_NUMBER: "1234567890"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Generate Next.js types
        run: npx next typegen

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build